<!DOCTYPE html>
<html>
    <head>
        <title>
            Java script utility function
        </title>
    </head>
    <body>
        <h1>Java Script utility programe</h1>
        <script>

            var str="web Programming";
            document.write("<h2> String Operation</h2>");
                document.write("String:"+str+"<br>");
                document.write("length:"+str.length+"<br>");
                document.write("uppercase:"+str.toUpperCase()+"<br>");
                document.write("lowercase:"+str.toLowerCase()+"<br>");

                var subjects=["HTML", "CSS", "JAVA SCRIPT ","php"];
                document.write("<h2> Array Operation</h2>");
                     document.write("Subjects:"+subjects+"<br>");
                     document.write("First Subjects:"+subjects[0]+"<br>");
                     document.write("Number of Subjects:"+subjects.length+"<br>");

                     document.write("<h2>Math Operation</h2>");
                        document.write("Square root of 25:"+Math.sqrt[25]+"<br>");
                        document.write("Power:"+Math.pow(2, 3)+"<br>");
                        document.write("Random Number:"+Math.random()+"<br>");

document.write("<h2>Date operation</h2>");

var today= new Date();
     document.write("Current Date and Time:"+today+"<br>");
     document.write("Year:"+today.getFullYear()+"<br>");
     document.write("month:"+(today.getMonth()+1)+"<br>");

        </script>
    </body>
</html>
